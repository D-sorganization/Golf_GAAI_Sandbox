<!DOCTYPE html>
<html>
<head>
    <title>Golf Modeling Suite - Setup Required</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #f0f0f0;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            max-width: 600px;
        }
        h1 { color: #0a84ff; margin-bottom: 10px; }
        .emoji { font-size: 4em; margin-bottom: 20px; }
        .code {
            background: #0d0d0d;
            padding: 15px 20px;
            border-radius: 8px;
            font-family: monospace;
            margin: 20px 0;
            text-align: left;
        }
        a {
            color: #0a84ff;
            text-decoration: none;
        }
        a:hover { text-decoration: underline; }
        .btn {
            display: inline-block;
            background: #0a84ff;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            margin-top: 20px;
            text-decoration: none;
        }
        .btn:hover {
            background: #0066cc;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">&#127948;&#65039;&#8205;&#9794;&#65039;</div>
        <h1>Golf Modeling Suite</h1>
        <h2>Web UI Setup Required</h2>
        <p>The web interface has not been built yet. Run these commands:</p>
        <div class="code">
            cd ui<br>
            npm install<br>
            npm run build
        </div>
        <p>Then restart the server.</p>
        <p style="color: #888; margin-top: 30px;">
            <strong>API is working!</strong> Check:
        </p>
        <p>
            <a href="/api/health">/api/health</a> |
            <a href="/api/docs">/api/docs</a> |
            <a href="/api/diagnostics/html">/api/diagnostics/html</a>
        </p>
        <a href="/api/diagnostics/html" class="btn">Run Diagnostics</a>
    </div>
</body>
</html>

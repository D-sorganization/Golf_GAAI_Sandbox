name: Jules PR Compiler

on:
  workflow_call:
    inputs:
      seed_pr:
        required: false
        type: string
      dry_run:
        required: false
        type: boolean
        default: true
      max_prs:
        required: false
        type: string
        default: "3"
  workflow_dispatch:
    inputs:
      seed_pr:
        description: "Optional seed PR to define the candidate pool"
        required: false
        type: string
      dry_run:
        description: "Report only"
        required: false
        default: true
        type: boolean
      max_prs:
        description: "Maximum candidate PRs to compile"
        required: false
        default: "3"
        type: string
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: jules-pr-compiler-${{ github.repository }}
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EVENT_NAME: ${{ github.event_name }}
      INPUT_SEED_PR: ${{ inputs.seed_pr }}
      DISPATCH_SEED_PR: ${{ github.event.inputs.seed_pr || '' }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
      DISPATCH_DRY_RUN: ${{ github.event.inputs.dry_run || '' }}
      INPUT_MAX_PRS: ${{ inputs.max_prs }}
      DISPATCH_MAX_PRS: ${{ github.event.inputs.max_prs || '' }}
      DEFAULT_BRANCH: ${{ vars.JULES_DEFAULT_BRANCH || 'main' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch Remote State
        run: git fetch origin --prune

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Select Compatible Candidate PRs
        env:
          REPO: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import datetime as dt
          import json
          import os
          import subprocess

          repo = os.environ["REPO"]
          if os.environ["EVENT_NAME"] == "workflow_call":
              seed_pr = os.environ.get("INPUT_SEED_PR", "")
              dry_run = (os.environ.get("INPUT_DRY_RUN", "") or "true").lower() == "true"
              max_prs = int(os.environ.get("INPUT_MAX_PRS", "") or "3")
          else:
              seed_pr = os.environ.get("DISPATCH_SEED_PR", "")
              dry_run = (os.environ.get("DISPATCH_DRY_RUN", "") or "true").lower() == "true"
              max_prs = int(os.environ.get("DISPATCH_MAX_PRS", "") or "3")

          allowed_task_labels = {
              "jules:docs",
              "jules:cleanup",
              "jules:review-fix",
              "jules:test-gen",
          }

          def run_json(command: list[str]) -> object:
              result = subprocess.run(command, check=True, capture_output=True, text=True)
              return json.loads(result.stdout)

          prs = run_json(
              [
                  "gh",
                  "pr",
                  "list",
                  "--repo",
                  repo,
                  "--state",
                  "open",
                  "--limit",
                  "100",
                  "--json",
                  "number,title,headRefName,baseRefName,isDraft,labels,mergeStateStatus,updatedAt,url",
              ]
          )

          seed = None
          if seed_pr:
              seed = next((pr for pr in prs if str(pr["number"]) == seed_pr), None)

          seed_task_label = None
          seed_base = None
          if seed:
              labels = {label["name"] for label in seed.get("labels", [])}
              seed_task_label = next((label for label in allowed_task_labels if label in labels), None)
              seed_base = seed["baseRefName"]

          eligible = []
          for pr in prs:
              labels = {label["name"] for label in pr.get("labels", [])}
              task_label = next((label for label in allowed_task_labels if label in labels), None)
              if "jules:managed" not in labels:
                  continue
              if "parallel:allowed" not in labels:
                  continue
              if "queue:compile-candidate" not in labels and not seed_pr:
                  continue
              if pr.get("isDraft"):
                  continue
              if "jules:blocked" in labels or "jules:needs-human" in labels:
                  continue
              if pr.get("mergeStateStatus") not in {"CLEAN", "HAS_HOOKS", "UNSTABLE"}:
                  continue
              if task_label is None:
                  continue
              if seed_task_label and task_label != seed_task_label:
                  continue
              if seed_base and pr["baseRefName"] != seed_base:
                  continue
              eligible.append(
                  {
                      "number": pr["number"],
                      "title": pr["title"],
                      "head": pr["headRefName"],
                      "base": pr["baseRefName"],
                      "task_label": task_label,
                      "updated_at": pr["updatedAt"],
                      "url": pr["url"],
                  }
              )

          eligible.sort(key=lambda item: item["updated_at"], reverse=True)
          selected = eligible[:max_prs]

          result = {
              "seed_pr": seed_pr,
              "dry_run": dry_run,
              "selected_count": len(selected),
              "selected": selected,
          }

          if selected:
              task_label = selected[0]["task_label"]
              base = selected[0]["base"]
              timestamp = dt.datetime.now(dt.timezone.utc).strftime("%Y%m%d-%H%M%S")
              result["branch_name"] = f"jules/compile-{task_label.split(':', 1)[1]}-{timestamp}"
              result["task_label"] = task_label
              result["base_branch"] = base

          with open("/tmp/jules_pr_compile_selection.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2)
          PY

      - name: Stop If Fewer Than Two Compatible PRs
        id: guard
        run: |
          COUNT=$(python3 - <<'PY'
          import json
          data = json.load(open("/tmp/jules_pr_compile_selection.json"))
          print(data.get("selected_count", 0))
          PY
          )
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -lt 2 ]; then
            echo "Not enough compatible PRs to compile."
          fi

      - name: Write Compiler Summary
        run: |
          python3 <<'PY'
          import json
          import os

          data = json.load(open("/tmp/jules_pr_compile_selection.json"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("## Jules PR Compiler\n\n")
              fh.write(f"- Dry run: `{str(data.get('dry_run', True)).lower()}`\n")
              fh.write(f"- Seed PR: `{data.get('seed_pr') or 'none'}`\n")
              fh.write(f"- Candidate count: `{data.get('selected_count', 0)}`\n")
              if data.get("selected"):
                  fh.write(f"- Base branch: `{data.get('base_branch')}`\n")
                  fh.write(f"- Task label: `{data.get('task_label')}`\n")
                  fh.write(f"- Planned compile branch: `{data.get('branch_name')}`\n")
                  fh.write("\n### Selected PRs\n\n")
                  for pr in data["selected"]:
                      fh.write(f"- #{pr['number']}: {pr['title']}\n")
          PY

      - name: Stop If Fewer Than Two Candidates
        if: steps.guard.outputs.count == '0' || steps.guard.outputs.count == '1'
        run: exit 0

      - name: Decide Execution Mode
        id: mode
        run: |
          DRY_RUN=$(python3 - <<'PY'
          import json
          data = json.load(open("/tmp/jules_pr_compile_selection.json"))
          print("true" if data.get("dry_run", True) else "false")
          PY
          )
          if [ "$DRY_RUN" = "true" ]; then
            echo "execute=false" >> "$GITHUB_OUTPUT"
          else
            echo "execute=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Compile Branch
        if: steps.mode.outputs.execute == 'true'
        run: |
          BASE_BRANCH=$(python3 - <<'PY'
          import json
          data = json.load(open("/tmp/jules_pr_compile_selection.json"))
          print(data["base_branch"])
          PY
          )
          BRANCH_NAME=$(python3 - <<'PY'
          import json
          data = json.load(open("/tmp/jules_pr_compile_selection.json"))
          print(data["branch_name"])
          PY
          )
          echo "BASE_BRANCH=$BASE_BRANCH" >> "$GITHUB_ENV"
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"
          git checkout "$BASE_BRANCH"
          git pull origin "$BASE_BRANCH"
          git checkout -b "$BRANCH_NAME"

      - name: Merge Candidate Branches
        if: steps.mode.outputs.execute == 'true'
        run: |
          python3 <<'PY' >/tmp/jules_compile_heads.txt
          import json
          data = json.load(open("/tmp/jules_pr_compile_selection.json"))
          for pr in data["selected"]:
              print(f"{pr['number']}|{pr['head']}")
          PY

          : > /tmp/jules_compile_merged.txt
          : > /tmp/jules_compile_conflicts.txt
          while IFS='|' read -r PR_NUMBER HEAD_BRANCH; do
            [ -z "$PR_NUMBER" ] && continue
            git fetch origin "$HEAD_BRANCH"
            if git merge --no-ff --no-edit "origin/$HEAD_BRANCH"; then
              echo "$PR_NUMBER|$HEAD_BRANCH" >> /tmp/jules_compile_merged.txt
            else
              git merge --abort || true
              echo "$PR_NUMBER|$HEAD_BRANCH" >> /tmp/jules_compile_conflicts.txt
            fi
          done < /tmp/jules_compile_heads.txt

      - name: Stop If Fewer Than Two Merged Cleanly
        if: steps.mode.outputs.execute == 'true'
        id: merged
        run: |
          COUNT=$(grep -c . /tmp/jules_compile_merged.txt || true)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -lt 2 ]; then
            echo "Fewer than two PRs merged cleanly into the compile branch."
            exit 0
          fi

      - name: Push Compile Branch
        if: steps.mode.outputs.execute == 'true' && steps.merged.outputs.count != '0' && steps.merged.outputs.count != '1'
        run: git push -u origin "$BRANCH_NAME"

      - name: Create Or Update Compiled PR
        if: steps.mode.outputs.execute == 'true' && steps.merged.outputs.count != '0' && steps.merged.outputs.count != '1'
        env:
          REPO: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import json
          import os
          import subprocess

          selection = json.load(open("/tmp/jules_pr_compile_selection.json"))

          merged = []
          with open("/tmp/jules_compile_merged.txt", "r", encoding="utf-8") as handle:
              for line in handle:
                  line = line.strip()
                  if not line:
                      continue
                  pr_number, head = line.split("|", 1)
                  merged.append((pr_number, head))

          conflicts = []
          with open("/tmp/jules_compile_conflicts.txt", "r", encoding="utf-8") as handle:
              for line in handle:
                  line = line.strip()
                  if not line:
                      continue
                  pr_number, head = line.split("|", 1)
                  conflicts.append((pr_number, head))

          body_lines = [
              "## Jules Compiled Batch",
              "",
              "This draft PR combines compatible Jules-managed PRs to reduce review and merge sprawl.",
              "",
              "### Source PRs",
          ]
          for pr_number, _head in merged:
              body_lines.append(f"- #{pr_number}")
          if conflicts:
              body_lines.extend(["", "### Skipped Due To Merge Conflicts"])
              for pr_number, _head in conflicts:
                  body_lines.append(f"- #{pr_number}")
          body = "\n".join(body_lines)

          task_label = selection["task_label"]
          title = f"[Jules] compiled batch: {task_label} ({len(merged)} PRs)"
          branch = os.environ["BRANCH_NAME"]
          base_branch = os.environ["BASE_BRANCH"]
          repo = os.environ["REPO"]

          existing_pr = subprocess.run(
              [
                  "gh",
                  "pr",
                  "list",
                  "--repo",
                  repo,
                  "--head",
                  branch,
                  "--state",
                  "open",
                  "--json",
                  "number",
                  "--jq",
                  ".[0].number",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()

          if existing_pr:
              subprocess.run(
                  [
                      "gh",
                      "pr",
                      "edit",
                      existing_pr,
                      "--repo",
                      repo,
                      "--title",
                      title,
                      "--body",
                      body,
                  ],
                  check=True,
              )
              subprocess.run(
                  [
                      "gh",
                      "pr",
                      "edit",
                      existing_pr,
                      "--repo",
                      repo,
                      "--add-label",
                      "jules:managed",
                      "--add-label",
                      "jules:compiled-batch",
                      "--add-label",
                      task_label,
                  ],
                  check=False,
              )
          else:
              subprocess.run(
                  [
                      "gh",
                      "pr",
                      "create",
                      "--repo",
                      repo,
                      "--base",
                      base_branch,
                      "--head",
                      branch,
                      "--title",
                      title,
                      "--body",
                      body,
                      "--draft",
                      "--label",
                      "jules:managed",
                      "--label",
                      "jules:compiled-batch",
                      "--label",
                      task_label,
                  ],
                  check=True,
              )

          compiled_pr_number = subprocess.run(
              [
                  "gh",
                  "pr",
                  "list",
                  "--repo",
                  repo,
                  "--head",
                  branch,
                  "--state",
                  "open",
                  "--json",
                  "number",
                  "--jq",
                  ".[0].number",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()

          for pr_number, _head in merged:
              subprocess.run(
                  [
                      "gh",
                      "pr",
                      "comment",
                      pr_number,
                      "--repo",
                      repo,
                      "--body",
                      f"This PR was included in compiled batch PR #{compiled_pr_number} on branch `{branch}` for bounded integration review.",
                  ],
                  check=False,
              )
          PY

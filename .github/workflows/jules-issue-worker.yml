name: Jules Issue Worker

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
      force:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to process"
        required: true
        type: string
      dry_run:
        description: "Report only"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: jules-issue-worker-${{ inputs.issue_number || github.event.inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:

  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN || github.token }}
        run: |
          ONLINE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
            --jq '[.runners[] | select(.status == "online") | select(.labels[].name == "d-sorg-fleet")] | length' \
            2>/dev/null || echo "0")
          if [[ "$ONLINE" -gt 0 ]]; then
            echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
            echo "Self-hosted runner online — routing locally"
          else
            echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
            echo "No self-hosted runner — using GitHub-hosted"
          fi
  process-issue:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    env:
      GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN || github.token }}
      ISSUE_NUMBER: ${{ inputs.issue_number || github.event.inputs.issue_number }}
      DRY_RUN: ${{ inputs.dry_run || github.event.inputs.dry_run || false }}
      DEFAULT_BRANCH: ${{ vars.JULES_DEFAULT_BRANCH || 'main' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Python Helpers
        run: pip install pyyaml

      - name: Gather Issue Context
        id: gather
        run: |
          python3 .github/jules/scripts/gh_helpers.py issue-context \
            --repo "$GITHUB_REPOSITORY" \
            --issue-number "$ISSUE_NUMBER" \
            --task-classes ".github/jules/task_classes.yml" \
            > /tmp/jules_issue_context.json

          python3 <<'PY'
          import json
          import os
          payload = json.load(open("/tmp/jules_issue_context.json"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              for key, value in payload.items():
                  fh.write(f"{key}={value}\n")
          PY

      - name: Find Existing PR Or Branch
        id: branch
        run: |
          python3 .github/jules/scripts/gh_helpers.py pr-lookup \
            --repo "$GITHUB_REPOSITORY" \
            --issue-number "$ISSUE_NUMBER" \
            --branch-prefix "${{ steps.gather.outputs.branch_prefix }}" \
            > /tmp/jules_pr_lookup.json

          EXISTING=$(cat /tmp/jules_pr_lookup.json)

          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            BRANCH_NAME=$(echo "$EXISTING" | jq -r '.headRefName')
            PR_NUMBER=$(echo "$EXISTING" | jq -r '.number')
            echo "reused=true" >> "$GITHUB_OUTPUT"
            echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            BRANCH_NAME="${{ steps.gather.outputs.branch_prefix }}${{ steps.gather.outputs.slug }}"
            if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
              echo "reused=true" >> "$GITHUB_OUTPUT"
            else
              echo "reused=false" >> "$GITHUB_OUTPUT"
            fi
            echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
          fi

      - name: Mark Issue Assigned
        if: env.DRY_RUN != 'true'
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --add-label "jules:assigned" \
            --remove-label "jules:queued" || true

      - name: Dry Run Summary
        if: env.DRY_RUN == 'true'
        run: |
          echo "Issue #$ISSUE_NUMBER"
          echo "Title: ${{ steps.gather.outputs.title }}"
          echo "Task class: ${{ steps.gather.outputs.task_class }}"
          echo "Validation profile: ${{ steps.gather.outputs.validation_profile }}"
          echo "Branch: ${{ steps.branch.outputs.branch_name }}"
          echo "Existing PR: ${{ steps.branch.outputs.pr_number }}"
          {
            python3 .github/jules/scripts/gh_helpers.py write-summary \
              --output "$GITHUB_STEP_SUMMARY" \
              --title "Jules Issue Worker Dry Run" \
              "Issue: #$ISSUE_NUMBER" \
              "Title: ${{ steps.gather.outputs.title }}" \
              "Task class: ${{ steps.gather.outputs.task_class }}" \
              "Validation profile: ${{ steps.gather.outputs.validation_profile }}" \
              "Branch: ${{ steps.branch.outputs.branch_name }}" \
              "Existing PR: ${{ steps.branch.outputs.pr_number || 'none' }}"
          }

      - name: Prepare Reused Branch
        if: env.DRY_RUN != 'true' && steps.branch.outputs.reused == 'true'
        run: |
          git fetch origin "${{ steps.branch.outputs.branch_name }}"
          git checkout -B "${{ steps.branch.outputs.branch_name }}" "origin/${{ steps.branch.outputs.branch_name }}"

      - name: Create Working Branch
        if: env.DRY_RUN != 'true' && steps.branch.outputs.reused != 'true'
        run: |
          git checkout "$DEFAULT_BRANCH"
          git pull origin "$DEFAULT_BRANCH"
          git checkout -b "${{ steps.branch.outputs.branch_name }}"
          git push -u origin "${{ steps.branch.outputs.branch_name }}"

      - name: Authenticate Jules
        if: env.DRY_RUN != 'true'
        run: |
          npm install -g @google/jules
          jules auth --token "${{ secrets.JULES_API_KEY }}"

      - name: Dispatch Jules Session
        if: env.DRY_RUN != 'true'
        run: |
          ISSUE_BODY=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq '.body')
          PROMPT=$(cat <<EOF
          You are working issue #$ISSUE_NUMBER in repository $GITHUB_REPOSITORY.

          Task class: ${{ steps.gather.outputs.task_class }}
          Validation profile: ${{ steps.gather.outputs.validation_profile }}
          Branch: ${{ steps.branch.outputs.branch_name }}

          Requirements:
          - Keep changes tightly scoped to the issue.
          - Reuse the existing branch and PR if one already exists.
          - Do not make unrelated refactors.
          - Update or create a PR that references "Closes #$ISSUE_NUMBER" only if the issue is fully addressed.
          - If blocked, leave the branch in a reviewable state and document the blocker.

          Issue body:
          $ISSUE_BODY
          EOF
          )

          jules task fix \
            --branch "${{ steps.branch.outputs.branch_name }}" \
            --prompt "$PROMPT"

      - name: Refresh Branch After Jules
        if: env.DRY_RUN != 'true'
        run: |
          git fetch origin "${{ steps.branch.outputs.branch_name }}"
          git checkout -B "${{ steps.branch.outputs.branch_name }}" "origin/${{ steps.branch.outputs.branch_name }}"

      - name: Run Validation Profile
        if: env.DRY_RUN != 'true'
        id: validation
        run: |
          python3 <<'PY' >/tmp/jules_validation_commands.txt
          import yaml
          profile = "${{ steps.gather.outputs.validation_profile }}"
          with open(".github/jules/validation_profiles.yml", "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)["validation_profiles"]
          for command in data.get(profile, {}).get("commands", []):
              print(command)
          PY

          set +e
          VALIDATION_OK=0
          VALIDATION_STATUS="passed"
          while IFS= read -r command; do
            [ -z "$command" ] && continue
            echo "Running: $command"
            bash -lc "$command"
            status=$?
            if [ $status -ne 0 ]; then
              VALIDATION_OK=1
              VALIDATION_STATUS="failed"
              break
            fi
          done < /tmp/jules_validation_commands.txt
          set -e

          if [ $VALIDATION_OK -eq 0 ]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi

          {
            python3 .github/jules/scripts/gh_helpers.py write-summary \
              --output "$GITHUB_STEP_SUMMARY" \
              --title "Jules Issue Worker" \
              "Issue: #$ISSUE_NUMBER" \
              "Branch: ${{ steps.branch.outputs.branch_name }}" \
              "Existing PR: ${{ steps.branch.outputs.pr_number || 'none' }}" \
              "Task class: ${{ steps.gather.outputs.task_class }}" \
              "Validation profile: ${{ steps.gather.outputs.validation_profile }}" \
              "Validation status: ${VALIDATION_STATUS}"
          }

      - name: Create Or Update PR
        if: env.DRY_RUN != 'true'
        run: |
          PR_NUMBER="${{ steps.branch.outputs.pr_number }}"
          BRANCH_NAME="${{ steps.branch.outputs.branch_name }}"
          TASK_LABEL="${{ steps.gather.outputs.task_label }}"
          TITLE="[Jules] issue #$ISSUE_NUMBER: $(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq '.title')"
          BODY=$(cat <<EOF
          ## Jules Issue Worker

          Source issue: #$ISSUE_NUMBER
          Task class: ${{ steps.gather.outputs.task_class }}
          Validation profile: ${{ steps.gather.outputs.validation_profile }}
          Validation status: ${{ steps.validation.outputs.status }}

          This PR was created or updated by the Jules issue worker.
          EOF
          )

          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "jules:managed" --add-label "$TASK_LABEL" || true
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH_NAME" \
              --title "$TITLE" \
              --body "$BODY" \
              --label "jules:managed" \
              --label "$TASK_LABEL" || true

            PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefName \
              --jq '[.[] | select(.headRefName == "'"$BRANCH_NAME"'")] | .[0].number')
          fi

          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"

      - name: Report Back To Issue
        if: env.DRY_RUN != 'true'
        run: |
          if [ "${{ steps.validation.outputs.status }}" = "passed" ]; then
            FINAL_LABEL="jules:done"
          else
            FINAL_LABEL="jules:blocked"
          fi

          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --remove-label "jules:blocked" \
            --remove-label "jules:done" \
            --remove-label "jules:assigned" \
            --add-label "$FINAL_LABEL" || true

          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(cat <<EOF
          Jules issue worker completed a run.

          - Branch: \`${{ steps.branch.outputs.branch_name }}\`
          - PR: #${PR_NUMBER:-${{ steps.branch.outputs.pr_number }}}
          - Task class: \`${{ steps.gather.outputs.task_class }}\`
          - Validation profile: \`${{ steps.gather.outputs.validation_profile }}\`
          - Validation status: \`${{ steps.validation.outputs.status }}\`
          - Result label: \`$FINAL_LABEL\`
          EOF
          )"

name: Docker Size and Health Check

on:
  push:
    branches: ["main"]

jobs:

  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        run: |
          ONLINE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
            --jq '[.runners[] | select(.status == "online") | select(.labels[].name == "d-sorg-fleet")] | length' \
            2>/dev/null || echo "0")
          if [[ "$ONLINE" -gt 0 ]]; then
            echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
            echo "Self-hosted runner online — routing locally"
          else
            echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
            echo "No self-hosted runner — using GitHub-hosted"
          fi
  docker-smoke-and-size:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image (runtime)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          load: true # Load image into local docker engine
          tags: upstream-drift:runtime
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Image Size Budget
        run: |
          # Runtime image budget: slim venv (~1 GB) + src/ models (~650 MB) + base + libs ≈ 4 GB
          MAX_SIZE_MB=4000

          # Get size in bytes
          IMAGE_SIZE_BYTES=$(docker image inspect upstream-drift:runtime --format='{{.Size}}')

          # Convert to MB
          IMAGE_SIZE_MB=$((IMAGE_SIZE_BYTES / 1024 / 1024))

          echo "Image size: ${IMAGE_SIZE_MB} MB"
          echo "Budget: ${MAX_SIZE_MB} MB"

          if [ "$IMAGE_SIZE_MB" -gt "$MAX_SIZE_MB" ]; then
            echo "::error::Image size (${IMAGE_SIZE_MB} MB) exceeds budget (${MAX_SIZE_MB} MB)!"
            exit 1
          else
            echo "Image size is within budget."
          fi

      - name: Run Basic Health Checks
        run: |
          docker run --rm upstream-drift:runtime python -c "import mujoco, numpy, scipy, pandas, matplotlib, sympy, defusedxml; print('Core physics and analysis stack OK')"
          docker run --rm upstream-drift:runtime python -c "import fastapi, uvicorn; print('API server stack OK')"
          docker run --rm upstream-drift:runtime python -c "import pinocchio; print('Pinocchio OK')"

      - name: Verify API Server Import
        run: |
          docker run --rm upstream-drift:runtime python -c "from src.api import server; print('API server module import OK')"

      - name: Verify API Health Endpoint
        run: |
          # Start the API server in detached mode, forwarding port 8000
          CID=$(docker run -d -p 8000:8000 \
            -e API_HOST=0.0.0.0 \
            -e ENVIRONMENT=development \
            upstream-drift:runtime \
            python -c "
          import uvicorn
          from src.api.server import app
          uvicorn.run(app, host='0.0.0.0', port=8000, log_level='warning')
          ")
          echo "Container ID: $CID"

          # Wait for the server to become ready (up to 30 s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Health endpoint responded on attempt $i"
              break
            fi
            sleep 1
          done

          # Assert the endpoint returns HTTP 200
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
          docker stop "$CID" || true

          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::/health returned HTTP $STATUS (expected 200)"
            exit 1
          fi
          echo "/health endpoint smoke test passed."

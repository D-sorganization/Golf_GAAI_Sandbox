name: Heavy Integration Tests
# ─────────────────────────────────────────────────────────────────────────────
# ISOLATION CONTRACT: This workflow MUST NOT run on standard PR required lanes.
#   • Triggers: manual dispatch, weekly schedule, or PRs with label 'run-heavy-tests'
#   • Runner: ubuntu-latest
#   • Markers: live_simulation or heavy_integration
#             (explicitly EXCLUDED from ci-standard.yml addopts and Run Core Test Suite)
#
# When to use:
#   - To verify long-running physics simulation tests before a major release
#   - When a PR touches core simulation or engine integration code
#     (apply the 'run-heavy-tests' label to trigger this workflow automatically)
#   - Runs automatically every Sunday at 02:00 UTC to catch drift
#
# Results artifact: pytest-results.xml (uploaded via actions/upload-artifact@v4)
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: "Python version to test with"
        required: false
        default: "3.11"
        type: choice
        options: ["3.10", "3.11", "3.12"]

  schedule:
    # Weekly Sunday 02:00 UTC
    - cron: "0 2 * * 0"

  pull_request:
    types: [labeled]

concurrency:
  group: heavy-integration-tests-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  heavy-integration-tests:
    name: Heavy Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Only run on PR labeled event when the label is 'run-heavy-tests'.
    # For schedule and workflow_dispatch events, always run.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'run-heavy-tests')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version || '3.11' }}
          cache: pip

      - name: Install system display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb x11-utils mesa-utils \
            libgl1 libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libdbus-1-3 libxrandr2 libxss1 libxcursor1 libxcomposite1 \
            libasound2-dev libxi6 libxtst6

      - name: Install Python dependencies
        timeout-minutes: 20
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install \
            pinocchio \
            mujoco \
            pytest \
            pytest-timeout \
            pytest-xdist

      - name: Run heavy integration tests
        timeout-minutes: 60
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            pytest \
              -v \
              -m "live_simulation or heavy_integration" \
              --timeout=300 \
              --timeout-method=thread \
              --tb=short \
              --no-header \
              --junitxml=pytest-results.xml \
              tests/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heavy-integration-test-results-${{ github.run_id }}
          path: pytest-results.xml
          retention-days: 30

      - name: Summarize test results
        if: always()
        run: |
          echo "## Heavy Integration Test Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Python version: ${{ inputs.python_version || '3.11' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Markers: \`live_simulation or heavy_integration\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f pytest-results.xml ]; then
            python3 - <<'PYEOF'
          import os
          import xml.etree.ElementTree as ET
          tree = ET.parse('pytest-results.xml')
          root = tree.getroot()
          suite = root.find('.//testsuite') or root
          total = int(suite.get('tests', 0))
          failures = int(suite.get('failures', 0))
          errors = int(suite.get('errors', 0))
          skipped = int(suite.get('skipped', 0))
          passed = total - failures - errors - skipped
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write(f"| Status | Count |\n|--------|-------|\n")
              fh.write(f"| Passed | {passed} |\n")
              fh.write(f"| Failed | {failures} |\n")
              fh.write(f"| Errors | {errors} |\n")
              fh.write(f"| Skipped | {skipped} |\n")
              fh.write(f"| Total | {total} |\n\n")
          PYEOF
          else
            echo "No test results XML found." >> "$GITHUB_STEP_SUMMARY"
          fi

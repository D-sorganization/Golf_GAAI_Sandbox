enabled: true
paused: false

defaults:
  default_branch: main
  require_ready_label: true
  ready_label: "jules:ready"
  queued_label: "jules:queued"
  assigned_label: "jules:assigned"
  blocked_label: "jules:blocked"
  done_label: "jules:done"
  needs_human_label: "jules:needs-human"
  repair_requested_label: "jules:repair-requested"
  comment_batch_label: "queue:batched"

limits:
  max_parallel_issues: 3
  max_pr_repair_attempts: 3
  repair_cooldown_minutes: 30

triggers:
  manual_issue_commands:
    - "/jules-run"
    - "/jules-retry"
    - "/jules-pause"
    - "/jules-resume"
    - "/jules-status"
  manual_pr_commands:
    - "/jules-fix-ci"
    - "/jules-address-comments"
    - "/jules-compile"
    - "/jules-stop"
  schedules:
    issue_queue_sweep: "*/30 * * * *"
    pr_shepherd_sweep: "15 */2 * * *"
    cleanup_sweep: "30 3 * * 1"
    pr_compiler_sweep: "0 4 * * 1"

branching:
  issue_prefix: "jules/issue-"
  ci_repair_prefix: "jules/ci-fix-"
  comment_fix_prefix: "jules/review-fix-"

pr:
  default_label: "jules:managed"
  draft_by_default: false

cleanup:
  stale_branch_days: 14
  stale_pr_days: 14
  stale_issue_days: 7
  require_manual_branch_delete: true

compiler:
  compile_candidate_label: "queue:compile-candidate"
  compiled_batch_label: "jules:compiled-batch"
  max_batch_size: 3
  allowed_task_labels:
    - "jules:docs"
    - "jules:cleanup"
    - "jules:review-fix"
    - "jules:test-gen"
  required_parallel_label: "parallel:allowed"
  branch_prefix: "jules/compile-"
  draft_by_default: true
